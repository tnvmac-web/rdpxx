name: RDP via ngrok

# Manual + scheduled. 6h per run, fresh each time.
on:
  workflow_dispatch:
    inputs:
      keep_alive_hours:
        description: 'How many hours the RDP session stays alive (max 6)'
        required: false
        default: '6'
  schedule:
    # 4x/day is enough; each run ~6h. Adjust/disable if not needed.
    - cron: '0 0,6,12,18 * * *'

# GitHub caps a single job at 6h.
# https://docs.github.com/actions/learn-github-actions/usage-limits
concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # 1. Enable RDP on the runner + set the runneradmin password
      # ─────────────────────────────────────────────────────────
      - name: Enable RDP & set user password
        shell: pwsh
        run: |
          # The GitHub-hosted Windows runner's interactive user is "runneradmin".
          # We set a known password on it so we can RDP in.
          $password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            Write-Host "runneradmin not found — creating it (rare; usually exists on windows-latest)"
            New-LocalUser -Name "runneradmin" -Password $password -FullName "runneradmin" -Description "GitHub Actions RDP user"
            Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          } else {
            Set-LocalUser -Name "runneradmin" -Password $password
            if (-not (Get-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
            }
          }

          # Enable RDP at the OS level.
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          # Make sure the TermService is running.
          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"

          Write-Host "RDP enabled on runneradmin / P@ssw0rd!"

      # ─────────────────────────────────────────────────────────
      # 2. Download + authenticate ngrok
      # ─────────────────────────────────────────────────────────
      - name: Install & auth ngrok
        shell: pwsh
        run: |
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          Invoke-WebRequest -Uri $ngrokUrl -OutFile "ngrok.zip" -UseBasicParsing
          Expand-Archive -Path "ngrok.zip" -DestinationPath "$env:USERPROFILE\ngrok" -Force
          $ngrokExe = "$env:USERPROFILE\ngrok\ngrok.exe"
          Test-Path $ngrokExe
          # Auth — token baked in as requested by repo owner.
          & $ngrokExe config add-authtoken "3H4TjJYutnnFRrEgSXaZL22wmBF_7V7wZNYSQ2X1LMZijfnvy"
          Write-Host "ngrok authenticated."

          # Expose the path for later steps via GITHUB_ENV.
          "NGROK_EXE=$ngrokExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ─────────────────────────────────────────────────────────
      # 3. Start ngrok TCP tunnel to localhost:3389 and parse the public endpoint
      # ─────────────────────────────────────────────────────────
      - name: Start ngrok tunnel & capture endpoint
        shell: pwsh
        run: |
          $ngrokExe = $env:NGROK_EXE
          # Start ngrok in the background pointing at RDP.
          Start-Process -FilePath $ngrokExe -ArgumentList "tcp","3389","--log=stdout","--log-format=logfmt" -RedirectStandardOutput "ngrok-stdout.log" -RedirectStandardError "ngrok-stderr.log" -NoNewWindow
          # Give ngrok a few seconds to register the tunnel.
          Start-Sleep -Seconds 10

          # Query ngrok's local API for the public endpoint. ngrok always exposes
          # its API on 127.0.0.1:4040 when running a single tunnel.
          $api = "http://127.0.0.1:4040/api/tunnels"
          $tunnelUrl = $null
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri $api -TimeoutSec 5
              $tcp = $resp.tunnels | Where-Object { $_.proto -eq "tcp" } | Select-Object -First 1
              if ($tcp -and $tcp.public_url) {
                $tunnelUrl = $tcp.public_url
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $tunnelUrl) {
            Write-Host "ngrok API did not return a tunnel URL. Dumping stdout/stderr for diagnosis:"
            Write-Host "── stdout ──"
            if (Test-Path "ngrok-stdout.log") { Get-Content "ngrok-stdout.log" -Tail 40 | Write-Host }
            Write-Host "── stderr ──"
            if (Test-Path "ngrok-stderr.log") { Get-Content "ngrok-stderr.log" -Tail 40 | Write-Host }
            exit 1
          }

          # $tunnelUrl looks like "tcp://0.tcp.ngrok.io:12345"
          Write-Host "ngrok public TCP URL: $tunnelUrl"
          $addr = $tunnelUrl -replace '^tcp://',''
          # Split off the port.
          $parts = $addr -split ':'
          $ipOrHost = $parts[0]
          $port = if ($parts.Length -gt 1) { $parts[1] } else { "3389" }

          # Human-readable banner in the log — this is what you'll open with mstsc.exe.
          $line = "============================================================"
          Write-Host $line
          Write-Host "  RDP READY"
          Write-Host "  Address  : ${ipOrHost}:${port}"
          Write-Host "  Username : runneradmin"
          Write-Host "  Password : P@ssw0rd!"
          Write-Host "  Connect  : mstsc /v:${ipOrHost}:${port}"
          Write-Host "  Lifetime : ~6h (this Actions job)"
          Write-Host $line

          # Persist for the keep-alive step so it can re-print at the end.
          "RDP_HOST=$ipOrHost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PORT=$port"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ─────────────────────────────────────────────────────────
      # 4. Keep the job alive — the tunnel dies when the job ends.
      #    Heartbeat every 5m, plus a final banner near the end.
      # ─────────────────────────────────────────────────────────
      - name: Keep alive (up to ~6h)
        shell: pwsh
        run: |
          $hours = 6
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            try {
              $ip = "${{ inputs.keep_alive_hours }}"
              if ($ip) { $hours = [int]$ip }
            } catch {}
          }
          if ($hours -gt 6) { $hours = 6 }
          $targetSeconds = $hours * 3600
          $slept = 0
          $tick = 300  # 5 minute heartbeat
          Write-Host "Keep-alive target: $($hours)h. RDP = $($env:RDP_HOST):$($env:RDP_PORT)"
          while ($slept -lt $targetSeconds) {
            $remaining = $targetSeconds - $slept
            $sleep = [Math]::Min($tick, $remaining)
            Start-Sleep -Seconds $sleep
            $slept += $sleep
            $hLeft  = [int][Math]::Floor($remaining / 3600)
            $mLeft  = [int][Math]::Floor(($remaining % 3600) / 60)
            Write-Host "heartbeat @ ${slept}s elapsed — RDP still live on $($env:RDP_HOST):$($env:RDP_PORT) (runneradmin / P@ssw0rd!) — ~$($hLeft)h$($mLeft)m left"
          }
          Write-Host "Keep-alive window exhausted — ngrok tunnel will close as the job exits."
