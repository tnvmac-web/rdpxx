name: RDP via bore tunnel

# Manual + scheduled. 6h per run, fresh each time.
"on":
  workflow_dispatch:
    inputs:
      keep_alive_hours:
        description: 'How many hours the RDP session stays alive (max 6)'
        required: false
        default: '6'
  schedule:
    # 4x/day. Each run ~6h. Adjust/disable if not needed.
    - cron: '0 0,6,12,18 * * *'

# GitHub caps a single job at 6h.
# https://docs.github.com/actions/learn-github-actions/usage-limits
concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    # Required so the workflow can open an issue with the RDP details as soon as it's known.
    permissions:
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────
      # 1. Enable RDP on the runner & set runneradmin password
      # ─────────────────────────────────────────────────────────
      - name: Enable RDP & set user password
        shell: pwsh
        run: |
          $password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $user = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            Write-Host "runneradmin not found — creating it"
            New-LocalUser -Name "runneradmin" -Password $password -FullName "runneradmin" -Description "GitHub Actions RDP user"
            Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
          } else {
            Set-LocalUser -Name "runneradmin" -Password $password
            if (-not (Get-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue)) {
              Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
            }
          }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0

          Set-Service -Name "TermService" -StartupType Automatic
          Start-Service -Name "TermService"

          Write-Host "RDP enabled. Username: runneradmin  Password: P@ssw0rd!"

      # ─────────────────────────────────────────────────────────
      # 2. Download + install bore (free TCP tunnel, no account, no card)
      # ─────────────────────────────────────────────────────────
      - name: Install bore
        shell: pwsh
        run: |
          $url = "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile "bore.zip" -UseBasicParsing
          Expand-Archive -Path "bore.zip" -DestinationPath "$env:USERPROFILE\bore" -Force
          $boreExe = "$env:USERPROFILE\bore\bore.exe"
          if (-not (Test-Path $boreExe)) {
            $found = Get-ChildItem -Path "$env:USERPROFILE\bore" -Recurse -Filter "bore.exe" | Select-Object -First 1
            if ($found) { $boreExe = $found.FullName } else { throw "bore.exe not found after extract" }
          }
          Write-Host "bore at: $boreExe"
          & $boreExe --version
          "BORE_EXE=$boreExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ─────────────────────────────────────────────────────────
      # 3. Start bore TCP tunnel to localhost:3389 and capture assigned port
      # ─────────────────────────────────────────────────────────
      - name: Start bore tunnel & capture endpoint
        shell: pwsh
        run: |
          $boreExe = $env:BORE_EXE
          Write-Host "Starting bore: $boreExe local 3389 --to bore.pub"

          Remove-Item -Path "bore-stdout.log","bore-stderr.log" -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath $boreExe `
            -ArgumentList @("local","3389","--to","bore.pub") `
            -RedirectStandardOutput "bore-stdout.log" `
            -RedirectStandardError  "bore-stderr.log" `
            -PassThru -NoNewWindow

          $assigned = $null
          for ($i = 0; $i -lt 30; $i++) {
            if (Test-Path "bore-stdout.log") {
              $content = Get-Content "bore-stdout.log" -ErrorAction SilentlyContinue
              $match = $content | Select-String -Pattern "listening (?:on|at)\s+bore\.pub:(\d+)" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($match) {
                $assigned = $match.Matches[0].Groups[1].Value
                Write-Host "Detected bore listening port: $assigned"
                break
              }
            }
            Start-Sleep -Seconds 1
          }

          if (-not $assigned) {
            Write-Host ""
            Write-Host "########## DIAGNOSTICS — bore did not report a listening port ##########"
            Write-Host "--- bore stdout (full) ---"
            if (Test-Path "bore-stdout.log") { Get-Content "bore-stdout.log" | ForEach-Object { Write-Host $_ } }
            Write-Host "--- bore stderr (full) ---"
            if (Test-Path "bore-stderr.log") { Get-Content "bore-stderr.log" | ForEach-Object { Write-Host $_ } }
            Write-Host "--- bore process state ---"
            if ($p.HasExited) { Write-Host "bore EXITED (code=$($p.ExitCode))" } else { Write-Host "bore still running, but no listening line after 30s" }
            Write-Host "#########################################################"
            exit 1
          }

          $host_ = "bore.pub"
          $port_ = $assigned

          $line = "============================================================"
          Write-Host $line
          Write-Host "  RDP READY — connect with mstsc.exe"
          Write-Host "  Address  : ${host_}:${port_}"
          Write-Host "  Username : runneradmin"
          Write-Host "  Password : P@ssw0rd!"
          Write-Host "  Connect  : mstsc /v:${host_}:${port_}"
          Write-Host "  Lifetime : ~6h (this Actions job)"
          Write-Host "  Tunnel   : bore.pub (free, no account, no card)"
          Write-Host $line

          "RDP_HOST=$host_" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PORT=$port_" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_USER=runneradmin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RDP_PASS=P@ssw0rd!"   | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Also write the connection info as a step summary so it shows in the Actions UI.
          @"
          ## 🖥️ RDP READY
          - **Address**: ${host_}:${port_}
          - **Username**: \`runneradmin\`
          - **Password**: \`P@ssw0rd!\`
          - **Connect**: \`mstsc /v:${host_}:${port_}\`
          - **Lifetime**: ~6h (this Actions job)
          - **Tunnel**: bore.pub (free)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      # ─────────────────────────────────────────────────────────
      # 4. Publish the connection details as an issue in this repo.
      #    The runner's GITHUB_TOKEN has issues:write permission we declared at the job level.
      #    The issue title contains the run id so we can find/close it programmatically.
      # ─────────────────────────────────────────────────────────
      - name: Publish RDP details to issue
        env:
          RDP_HOST: ${{ env.RDP_HOST }}
          RDP_PORT: ${{ env.RDP_PORT }}
          RDP_USER: ${{ env.RDP_USER }}
          RDP_PASS: ${{ env.RDP_PASS }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `RDP-active-run-${{ github.run_id }}`;
            const body  = [
              '## 🖥️ RDP session is LIVE',
              '',
              `Run: \`${{ github.run_id }}\` · Workflow: \`${{ github.workflow }}\` · Started: \`${{ github.event.head_commit.timestamp || github.run_attempt }}\``,
              '',
              `- **Address**: \`${process.env.RDP_HOST}:${process.env.RDP_PORT}\``,
              `- **Username**: \`${process.env.RDP_USER}\``,
              `- **Password**: \`${process.env.RDP_PASS}\``,
              `- **Connect**: \`mstsc /v:${process.env.RDP_HOST}:${process.env.RDP_PORT}\``,
              `- **Lifetime**: ~6h (this Actions job)`,
              '',
              '_This issue is auto-created by the workflow. It will close when the job ends._',
            ].join('\n');
            // Look for an existing open issue with this run's title (re-trigger cases).
            const q = `repo:${process.env.GITHUB_REPOSITORY} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              const num = found.data.items[0].number;
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: num, body });
              core.info(`Updated issue #${num}`);
            } else {
              const created = await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
              core.info(`Created issue #${created.data.number}`);
            }

      # ─────────────────────────────────────────────────────────
      # 5. Keep alive — the tunnel dies when the job ends.
      # ─────────────────────────────────────────────────────────
      - name: Keep alive (up to ~6h)
        shell: pwsh
        run: |
          $hours = 6
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            try {
              $ip = "${{ inputs.keep_alive_hours }}"
              if ($ip) { $hours = [int]$ip }
            } catch {}
          }
          if ($hours -gt 6) { $hours = 6 }
          $targetSeconds = $hours * 3600
          $slept = 0
          $tick = 300  # 5-minute heartbeat
          Write-Host "Keep-alive target: $($hours)h. RDP = $($env:RDP_HOST):$($env:RDP_PORT)"
          while ($slept -lt $targetSeconds) {
            $remaining = $targetSeconds - $slept
            $sleep = [Math]::Min($tick, $remaining)
            Start-Sleep -Seconds $sleep
            $slept += $sleep
            $hLeft  = [int][Math]::Floor($remaining / 3600)
            $mLeft  = [int][Math]::Floor(($remaining % 3600) / 60)
            Write-Host "heartbeat @ ${slept}s — RDP still live on $($env:RDP_HOST):$($env:RDP_PORT) (runneradmin / P@ssw0rd!) — ~$($hLeft)h$($mLeft)m left"
          }
          Write-Host "Keep-alive window exhausted — bore tunnel will close as the job exits."
